training:
  output_dir: "outputs/checkpoints_smoke"
  num_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.0
  weight_decay: 0.01
  fp16: false
  bf16: false
  logging_steps: 1
  save_steps: 100
  save_total_limit: 1
  dataloader_num_workers: 0
  max_seq_length: 512

datasets:
  mathvista:
    weight: 1.0
    split: "testmini"
    max_samples: 30

logit_cache:
  output_dir: "outputs/logits_smoke"
  file_prefix: "topk_logits"
  chunk_size: 10
