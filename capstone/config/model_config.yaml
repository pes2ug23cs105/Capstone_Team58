teacher:
  model_id: "Qwen/Qwen2.5-VL-32B-Instruct"
  load_in_4bit: true
  device_map: "auto"
  max_new_tokens: 1024
  top_k_logits: 64               # Top-K sparse logit caching

student:
  model_id: "Qwen/Qwen2.5-VL-7B-Instruct"
  load_in_4bit: false
  device_map: "auto"
  max_new_tokens: 1024

lora:
  rank: 16
  lora_alpha: 32
  scaling_factor: 2.0            # alpha / rank
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "v_proj"
    - "k_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

distillation:
  temperature: 4.0               # Softmax temperature for KD
  alpha: 0.5                     # Weight: alpha * CE + (1-alpha) * KD
  entropy_threshold: 1.5         # Min entropy to flag a token as a reasoning token
  reasoning_weight: 3.0          # Extra loss multiplier on reasoning tokens
