teacher:
  model_id: "Qwen/Qwen2.5-VL-3B-Instruct"
  load_in_4bit: true
  device_map: "auto"
  max_new_tokens: 8
  top_k_logits: 8

student:
  model_id: "Qwen/Qwen2.5-VL-7B-Instruct"
  load_in_4bit: false
  device_map: "auto"
  max_new_tokens: 128

lora:
  rank: 16
  lora_alpha: 32
  scaling_factor: 2.0
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "v_proj"
    - "k_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

distillation:
  temperature: 4.0
  alpha: 0.5
  entropy_threshold: 1.5
  reasoning_weight: 3.0
